name: Tests (saved clips and slow-motion reading)
# Runs on every push to main and on pull requests: re-analyses the saved tracker output of the reference clips
# (Maher, Hackimer, Staumont, each also as a mirror-image lefty) and checks the slow-motion reading on the
# motion-capture benchmark pitches. A red X on a commit means a change moved an event time, the throwing hand, a
# joint angle on the lefty copy, or a speed reading. No videos and no secrets are used.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reference clips (event times, speed, throwing hand, lefty copies)
        run: node tools/test/regress.mjs
  slow-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Slow-motion reading on the benchmark pitches (1x, 2x, 4x, 8x)
        run: node tools/test/slowmo.mjs
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Accuracy scorecard vs motion capture (fails only if a camera angle gets clearly worse)
        run: node tools/test/bench.mjs
      - name: Per-view check against the previous commit (averages can hide a reading getting much worse on a few views)
        run: |
          git worktree add -q "$RUNNER_TEMP/prev" HEAD~1
          node tools/test/perview.mjs "$RUNNER_TEMP/prev" --check
  exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a headless browser and ffmpeg (test tools only; the website itself uses neither)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg poppler-utils
          pip install -q playwright && playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/t3" && cd "$RUNNER_TEMP/t3" && npm i --silent three@0.128.0
      - name: PDF and CSV match the screen; saved pitches re-open the same
        env:
          ORBIT_JS: tools/test/orbit_stub.js
        run: |
          export THREE_JS="$RUNNER_TEMP/t3/node_modules/three/build/three.min.js"
          python3 tools/test/serve.py . 8766 &
          sleep 2
          python3 tools/test/export_check.py tools/test/fixtures/maher_fast.json.gz "$RUNNER_TEMP/export"
