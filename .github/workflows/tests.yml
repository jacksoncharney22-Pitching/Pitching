name: Tests (saved clips and slow-motion reading)
# Runs on every push to main and on pull requests: re-analyses the saved tracker output of the reference clips
# (Maher, Hackimer, Staumont, each also as a mirror-image lefty) and checks the slow-motion reading on the
# motion-capture benchmark pitches. A red X on a commit means a change moved an event time, the throwing hand, a
# joint angle on the lefty copy, or a speed reading. No videos and no secrets are used.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reference clips (event times, speed, throwing hand, lefty copies)
        run: node tools/test/regress.mjs
      - name: Max accuracy combines frames with only a few looks
        run: node tools/test/fuse_check.mjs
      - name: Lab-matched body is refused when it doesn't line up with the video
        run: node tools/test/fitguard.mjs
  slow-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Slow-motion reading on the benchmark pitches (1x, 2x, 4x, 8x)
        run: node tools/test/slowmo.mjs
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Accuracy scorecard vs motion capture (fails only if a camera angle gets clearly worse)
        run: node tools/test/bench.mjs
      - name: Delivery numbers (stride, arm slot, hand height, separation, extension) no worse vs motion capture
        run: node tools/test/measures.mjs --check
      - name: Compare screen thresholds still match the skeleton
        run: node tools/test/comparecheck.mjs --check
      - name: Per-view check against the previous commit (averages can hide a reading getting much worse on a few views)
        run: |
          git worktree add -q "$RUNNER_TEMP/prev" HEAD~1
          node tools/test/perview.mjs "$RUNNER_TEMP/prev" --check
  unusual:
    # 14 unusual lab deliveries (sidearm, very high slot, short/long stride, quick leg lift, big side tilt, lefties) made
    # from the OpenBiomechanics lab data (downloaded here, never stored in the repo) seen through the benchmark's cameras.
    # Fails if a camera angle gets clearly worse on them than tools/test/unusual_baseline.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lab data (checksum checked) and the unusual deliveries
        run: |
          pip install -q numpy pandas
          cd "$RUNNER_TEMP"
          curl -sSL -o lab.zip https://github.com/drivelineresearch/openbiomechanics/releases/download/dataset-v1/pitching_landmarks.zip
          echo "efcc078d5d8e77ed1fbf0b9f6a78f750c57a624165f71f30e34142b74db7ec22  lab.zip" | sha256sum -c -
          python3 -c "import zipfile; zipfile.ZipFile('lab.zip').extractall('lab')"
          curl -sSL -o lab/metadata.csv https://raw.githubusercontent.com/drivelineresearch/openbiomechanics/main/baseball_pitching/data/metadata.csv
          cd "$GITHUB_WORKSPACE"
          python3 tools/test/unusual_make.py "$RUNNER_TEMP/lab/landmarks.csv" "$RUNNER_TEMP/lab/metadata.csv" "$RUNNER_TEMP/unusual"
      - name: Unusual deliveries no worse vs motion capture
        run: BENCHDIR="$RUNNER_TEMP/unusual" BENCHBASE=tools/test/unusual_baseline.json node tools/test/bench.mjs
  exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a headless browser and ffmpeg (test tools only; the website itself uses neither)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg poppler-utils
          pip install -q playwright numpy pillow && playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/t3" && cd "$RUNNER_TEMP/t3" && npm i --silent three@0.128.0
      - name: PDF and CSV match the screen; saved pitches re-open the same
        env:
          ORBIT_JS: tools/test/orbit_stub.js
        run: |
          export THREE_JS="$RUNNER_TEMP/t3/node_modules/three/build/three.min.js"
          python3 tools/test/serve.py . 8766 &
          sleep 2
          python3 tools/test/export_check.py tools/test/fixtures/maher_fast.json.gz "$RUNNER_TEMP/export"
          python3 tools/test/video_check.py tools/test/fixtures/maher_fast.json.gz "$RUNNER_TEMP/video"
          python3 tools/test/history_check.py tools/test/fixtures/maher_fast.json.gz
          python3 tools/test/storage_check.py
          python3 tools/test/finder_check.py tools/test/fixtures/maher_fast.json.gz "$RUNNER_TEMP/finder"
          python3 tools/test/anaworker_check.py tools/test/fixtures/*.json.gz
          python3 tools/test/ortproxy_check.py tools/test/fixtures/maher_fast.json.gz --rtm
          ffmpeg -v error -f lavfi -i testsrc2=size=1920x1080:rate=60 -t 3 -c:v libvpx-vp9 -b:v 4M -an "$RUNNER_TEMP/testsrc.webm"
          python3 tools/test/keepclip_check.py "$RUNNER_TEMP/testsrc.webm"
