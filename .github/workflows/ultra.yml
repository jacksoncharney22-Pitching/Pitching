name: Deploy Ultra (cloud 3D)
on:
  push:
    branches: [main]
    paths: ["ultra/**", ".github/workflows/ultra.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install modal==1.6.2
      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          # pasted secrets often carry a stray space or line break: trim them
          export MODAL_TOKEN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | tr -d '[:space:]')"
          export MODAL_TOKEN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | tr -d '[:space:]')"
          [ -z "$MODAL_TOKEN_ID" ] && echo "::error::MODAL_TOKEN_ID repository secret is missing or empty"
          [ -z "$MODAL_TOKEN_SECRET" ] && echo "::error::MODAL_TOKEN_SECRET repository secret is missing or empty"
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then exit 1; fi
          # shape check only (first 3 characters and length; the values themselves are never printed)
          echo "::warning::token id starts '${MODAL_TOKEN_ID:0:3}' length ${#MODAL_TOKEN_ID}; token secret starts '${MODAL_TOKEN_SECRET:0:3}' length ${#MODAL_TOKEN_SECRET}"
          case "$MODAL_TOKEN_ID$MODAL_TOKEN_SECRET" in *" "*|*$'\n'*|*$'\r'*) echo "::warning::a token has a space or line break in it";; esac
          set -o pipefail
          if ! modal deploy ultra/app.py 2>&1 | tee deploy.log; then
            echo "::error::modal deploy failed: $(tail -c 900 deploy.log | tr '\n' ' ')"
            exit 1
          fi
      - name: Warm up (downloads the models once into the cache)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          export MODAL_TOKEN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | tr -d '[:space:]')"
          export MODAL_TOKEN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | tr -d '[:space:]')"
          URL=$(python ultra/url.py 2>/dev/null || true)
          echo "ULTRA_URL=$URL"
          if [ -n "$URL" ]; then curl -s -m 900 "$URL/health" || true; fi
